jobs:
  build:
    name: Build (Production)
    # Defaults to GitHub-hosted; set the repository variable CI_RUNNER to use the self-hosted runner.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

