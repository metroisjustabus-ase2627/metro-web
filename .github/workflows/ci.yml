# Requirements: CON-CI-01 (automatic build from the repository), CON-CI-02.
# After a successful build, the "image" job builds the Docker image and, on pushes to main, pushes it to GHCR
# tagged with the commit SHA (CON-CI-02, CON-DEP-01). Pushes to develop deploy the web app to GitHub Pages.

name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'bugfix/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
