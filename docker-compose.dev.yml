# Reproducible Development VM deployment using immutable GHCR image (CON-DEP-01, CON-DEP-02, CON-CI-02).
# Never rebuild on the VM (Build Only Once — T03).
# Usage on Dev VM:
#   IMAGE_TAG=<commit-sha> docker compose -f docker-compose.dev.yml --env-file .env.dev pull
#   IMAGE_TAG=<commit-sha> docker compose -f docker-compose.dev.yml --env-file .env.dev up -d

services:
  web:
    image: ghcr.io/metroisjustabus-ase2627/metro-web:${IMAGE_TAG:-latest}
    container_name: metro-dev-web
    restart: unless-stopped
    ports:
      - "${WEB_HOST_PORT:-4200}:80"
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - metro-dev-web-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  metro-dev-web-net:
    driver: bridge
